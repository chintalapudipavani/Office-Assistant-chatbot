{% extends "base.html" %}
{% block title %}Create account - Office Assistant{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-8 col-lg-5">
  <h1 class="h4 mb-3">Create your account</h1>
  <div class="card shadow-sm"><div class="card-body">
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% include "includes/form_fields.html" %}
      <button class="btn btn-primary w-100" type="submit">Create account</button>
    </form>
  </div></div>
  <p class="mt-3 small">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div></div>
{% endblock %}
